<!-- ============ ALL SALES ACTIVITIES VIEW ============ -->
<div id="allSalesActivitiesContainer" class="content" style="display:none;">
  <h2 class="table-title">Sales Activities</h2>
  <div class="filter-bar">
    <label>Date Range:</label>
    <input type="date" id="salesActivityStartDate" class="filter-input">
    <span>to</span>
    <input type="date" id="salesActivityEndDate" class="filter-input">
    <label for="salesActivityOfficerFilter">Credit Officer:</label>
    <select id="salesActivityOfficerFilter" class="filter-select">
      <option value="">All Officers</option>
    </select>
    <button onclick="filterSalesActivities()" class="filter-btn">Filter</button>
    <button onclick="resetSalesActivityFilters()" class="filter-btn">Reset</button>
  </div>
  <div class="modal-table-wrapper">
    <table class="call-report-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Credit Officer</th>
          <th>Destination/Area</th>
          <th>Clients Visited</th>
          <th>Transport Mode</th>
          <th>Sales Activity</th>
          <th>Remarks/Outcome</th>
        </tr>
      </thead>
      <tbody id="allSalesActivitiesTableBody"></tbody>
    </table>
  </div>
</div>

<!-- ============ SALES ACTIVITY MODAL ============ -->
<div id="sales-activity-modal" class="modal">
  <div class="modal-content sales-activity-modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Add Sales Activity</h2>
      <div class="modal-actions">
        <span class="modal-close" onclick="closeSalesActivityModal()" title="Close">&times;</span>
      </div>
    </div>

    <form id="sales-activity-form" onsubmit="event.preventDefault(); saveSalesActivity();">
      <div class="activity-form">
        <div class="form-row">
          <div class="form-group">
            <label for="activity-date">Date</label>
            <input type="date" id="activity-date" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="destination">Destination / Area</label>
            <select id="destination" class="form-input" required>
              <option value="">Select Area</option>
              <option value="Accra">Accra</option>
              <option value="Osu">Osu</option>
              <option value="Abossey Okai">Abossey Okai</option>
              <option value="Kaneshie">Kaneshie</option>
              <option value="La">La</option>
              <option value="Cantonment">Cantonment</option>
              <option value="Telephone Call">Telephone Call</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="clients-visited">Clients Visited / Contacted</label>
            <input type="text" id="clients-visited" class="form-input" required>
          </div>
          <div class="form-group">
            <label for="transport-mode">Mode of Transport</label>
            <select id="transport-mode" class="form-input" required>
              <option value="">Select Transport</option>
              <option value="Company Car">Company Car</option>
              <option value="Public Transport">Public Transport</option>
              <option value="Bolt/Uber">Bolt/Uber</option>
              <option value="Not applicable">Not applicable</option>
            </select>
          </div>
        </div>

        <div class="form-group full-width">
          <label for="sales-activity">Sales Activity</label>
          <textarea id="sales-activity" class="form-textarea" rows="3" required></textarea>
        </div>

        <div class="form-group full-width">
          <label for="remarks">Remarks / Outcome</label>
          <textarea id="remarks" class="form-textarea" rows="3" required></textarea>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="modal-cancel-btn" onclick="closeSalesActivityModal()">
          <i class="material-icons">cancel</i> Cancel
        </button>
        <button type="submit" class="modal-save-btn">
          <i class="material-icons">save</i> Save Activity
        </button>
      </div>
    </form>
  </div>
</div>
